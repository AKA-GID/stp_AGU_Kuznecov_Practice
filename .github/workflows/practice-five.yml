name: Practice five

on:
  push:
    branches: [Practice_five]
  pull_request:
    branches: [Practice_five]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build example
        run: g++ -std=c++17 -Wall -Wextra -pedantic Book.cpp ebook.cpp main.cpp -o ebook_demo

      - name: Run example and check output
        shell: bash
        run: |
          ./ebook_demo | tee practice-five-output.txt
          grep -Fq "Book: 1984 by George Orwell (1949)" practice-five-output.txt
          grep -Fq "Ebook through Book reference: 1984 by George Orwell (1949) [URL: http://example.com/1984]" practice-five-output.txt
          grep -Fq "Invalid title rejected:" practice-five-output.txt
